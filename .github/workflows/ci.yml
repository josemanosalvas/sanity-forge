name: CI

on:
  pull_request:
    branches: ["*"]
  push:
    branches: ["main"]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FORCE_COLOR: 3
  # Turborepo Remote Caching (optional): https://turborepo.com/docs/core-concepts/remote-caching
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # Env validation, schema extraction and TypeGen never contact Sanity, so a
  # placeholder project keeps every check runnable on a fork. Set the
  # SANITY_PROJECT_ID / SANITY_DATASET repository variables (and the
  # SANITY_API_READ_TOKEN secret) to also build and smoke-test the web app.
  NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || 'placeholder' }}
  NEXT_PUBLIC_SANITY_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
  SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_PROJECT_ID || 'placeholder' }}
  SANITY_STUDIO_DATASET: ${{ vars.SANITY_DATASET || 'production' }}
  SANITY_STUDIO_PREVIEW_ENVIRONMENT: production
  # Required for a production build; a loopback origin is dropped from the
  # frame-ancestors policy, so CI builds never framed by a Studio are fine.
  NEXT_PUBLIC_SANITY_STUDIO_URL: http://localhost:3333

jobs:
  check:
    name: Format, lint and workspace checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm lint:ws
      - run: pnpm boundaries

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - run: pnpm typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - run: pnpm test

  typegen:
    name: Sanity TypeGen freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - run: pnpm typegen
      - name: Verify generated types are committed
        run: git diff --exit-code -- packages/sanity/src/sanity.types.ts apps/studio/schema.json

  schema:
    name: Sanity schema validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      # `schema extract` only serializes the schema; validation is what reports
      # invalid field options, dangling reference targets and duplicate type
      # names. Same pinned workspace: every site shares one schema.
      - run: pnpm --filter studio exec sanity schema validate --workspace brand-a

  build:
    name: Build Studio and Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - run: pnpm turbo run build --filter=studio --filter=storybook

  web:
    name: Build web and run Playwright smoke tests
    # Prerendering reads real content, so this needs a Sanity project and its viewer token.
    if: ${{ vars.SANITY_PROJECT_ID != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}
      DEFAULT_SITE: brand-a
      E2E_HAS_CONTENT: ${{ vars.E2E_HAS_CONTENT || 'false' }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./tooling/github/setup
      - run: pnpm turbo run build --filter=web
      - name: Check CMS prerendering
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('apps/web/.next/prerender-manifest.json', 'utf8'));
          const routes = Object.entries(manifest.routes)
            .filter(([, route]) => route.compute === 'static')
            .map(([path]) => path);
          if (process.env.E2E_HAS_CONTENT === 'true') {
            assert(routes.includes('/brand-a/en'), 'The published homepage must be prerendered');
          } else {
            const paths = [...routes, ...manifest.notFoundRoutes];
            assert(paths.some((path) => /^\/brand-a\/en(?:\/|$)/.test(path)),
              'No prerendered CMS page or placeholder found');
          }
          NODE
      - name: Check that the Viewer token is not in the build output
        if: ${{ env.SANITY_API_READ_TOKEN != '' }}
        shell: bash
        run: |
          test -d apps/web/.next/server && test -d apps/web/.next/static
          if grep -rqF --exclude-dir=cache "$SANITY_API_READ_TOKEN" apps/web/.next; then
            echo 'SANITY_API_READ_TOKEN found in the build output'; exit 1
          fi
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
