packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  # Toolchain
  "@shadcn/lint": ^0.2.0
  "@turbo/gen": ^2.11.7
  oxfmt: ^0.71.0
  oxlint: ^1.86.0
  sherif: ^1.13.0
  turbo: ^2.11.7
  typescript: 7.0.2
  ultracite: ^7.12.2

  # Runtime
  "@types/node": ^24.13.3
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@next/bundle-analyzer": 16.3.8
  "@next/env": 16.3.8
  "@next/third-parties": 16.3.8
  "@vercel/speed-insights": ^2.0.0
  next: 16.3.8
  react: ^19.3.0
  react-dom: ^19.3.0
  react-is: ^19.3.0
  server-only: ^0.0.1
  zod: ^4.6.5

  # Environment contracts (package-owned keys.ts)
  "@t3-oss/env-core": ^0.13.11
  "@t3-oss/env-nextjs": ^0.13.11

  # Sanity
  "@sanity/client": ^8.9.0
  "@sanity/codegen": ^8.1.1
  "@sanity/document-internationalization": ^6.2.39
  "@sanity/icons": ^5.2.3
  "@sanity/image-url": ^2.1.1
  "@sanity/ui": ^4.3.0
  "@sanity/language-filter": ^5.0.19
  next-sanity: 13.3.4
  sanity: ^6.17.0
  sanity-plugin-internationalized-array: ^5.3.2
  styled-components: ^6.5.3

  # Styling / design system
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/typography": ^0.5.20
  class-variance-authority: ^0.7.1
  cn: ^0.4.0
  lucide-react: ^1.51.0
  next-themes: ^0.4.6
  postcss: ^8.5.28
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0

  # Internationalization
  next-intl: ^4.14.9

  # Testing
  groq-js: ^2.0.0
  "@playwright/test": ^1.63.0
  "@vitejs/plugin-react": ^6.1.1
  vite: ^8.3.2
  vitest: ^5.0.3

  # Storybook
  "@storybook/addon-a11y": ^10.6.1
  "@storybook/addon-docs": ^10.6.1
  "@storybook/addon-themes": ^10.6.1
  "@storybook/nextjs-vite": ^10.6.1
  "@storybook/react": ^10.6.1
  storybook: ^10.6.1

# Native builds that pnpm 11 blocks unless allowed explicitly.
allowBuilds:
  "@parcel/watcher": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0
  - "@shadcn/lint@0.2.0"
