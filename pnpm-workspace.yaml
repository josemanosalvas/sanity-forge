packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  # Toolchain
  "@turbo/gen": ^2.10.12
  oxfmt: ^0.66.0
  oxlint: ^1.81.0
  sherif: ^1.13.0
  turbo: ^2.10.12
  typescript: 5.9.3
  ultracite: ^7.10.8

  # Runtime
  "@types/node": ^24.13.3
  "@types/react": ^19.2.18
  "@types/react-dom": ^19.2.7
  "@next/bundle-analyzer": 16.3.4
  "@next/third-parties": 16.3.4
  next: 16.3.4
  react: ^19.2.8
  react-dom: ^19.2.8
  react-is: ^19.2.8
  server-only: ^0.0.1
  zod: ^4.5.4

  # Environment contracts (package-owned keys.ts)
  "@t3-oss/env-core": ^0.13.11
  "@t3-oss/env-nextjs": ^0.13.11

  # Sanity
  "@sanity/client": ^8.5.0
  "@sanity/codegen": ^8.1.0
  "@sanity/document-internationalization": ^6.2.35
  "@sanity/icons": ^5.2.1
  "@sanity/image-url": ^2.1.1
  "@sanity/ui": ^4.0.7
  "@sanity/language-filter": ^5.0.18
  "@sanity/visual-editing": ^6.1.2
  groq: ^6.12.0
  next-sanity: 13.3.4
  sanity: ^6.12.0
  sanity-plugin-internationalized-array: ^5.2.4
  styled-components: ^6.5.3

  # Styling / design system
  "@tailwindcss/postcss": ^4.3.3
  "@tailwindcss/typography": ^0.5.20
  class-variance-authority: ^0.7.1
  cn: ^0.2.5
  lucide-react: ^1.41.0
  next-themes: ^0.4.6
  postcss: ^8.5.28
  radix-ui: ^1.6.7
  tailwindcss: ^4.3.3
  tw-animate-css: ^1.4.0

  # Internationalization
  next-intl: ^4.14.2

  # Testing
  "@playwright/test": ^1.63.0
  "@testing-library/jest-dom": ^7.0.1
  "@testing-library/react": ^16.3.3
  "@vitejs/plugin-react": ^6.1.1
  vite: ^8.2.2
  vitest: ^5.0.0

  # Storybook
  "@storybook/addon-a11y": ^10.6.0
  "@storybook/addon-docs": ^10.6.0
  "@storybook/addon-themes": ^10.6.0
  "@storybook/nextjs-vite": ^10.6.0
  "@storybook/react": ^10.6.0
  storybook: ^10.6.0

# Native builds that pnpm 11 blocks unless allowed explicitly.
allowBuilds:
  "@parcel/watcher": true
  "@sentry/cli": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true

linkWorkspacePackages: true

minimumReleaseAgeExclude:
  - "@base-ui/react@1.8.0"
  - "@base-ui/utils@0.4.0"
  - lucide-react@1.41.0
  - "@playwright/test@1.63.0"
  - playwright-core@1.63.0
  - playwright@1.63.0
